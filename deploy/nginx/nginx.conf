# UNTESTED ON THE VPS: run on staging first.
# Reverse proxy in front of the web (SvelteKit) and api (Go) containers.
# TODO (OQ-16 / NFR-05): TLS (certificate from Diskominfo), HSTS and CSP. Until then this listens on plain HTTP and
#   must sit behind the agency's TLS terminator. NFR-05 requires HTTPS for production.
worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  sendfile on;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  # Upload size limit: intentionally NOT set. nginx's default (1m) applies until the numbers are decided.
  # TODO (OQ-12 / NFR-06): set client_max_body_size per location (public forms, admin uploads) from the TDD.
  # Do not invent numbers here.

  # Per-IP rate limit for the public forms (NFR-07 adds an application-level limit as well).
  limit_req_zone $binary_remote_addr zone=forms:10m rate=30r/m;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "DENY" always;

  upstream api { server api:8080; }
  upstream web { server web:3000; }

  server {
    listen 80;
    server_name _;

    # Admin panel and admin API: network allowlist (see admin-allowlist.conf).
    location ~ ^/(admin|api/v1/admin)(/|$) {
      include /etc/nginx/admin-allowlist.conf;
      # $http_host keeps the port: the API compares the browser's Origin (host:port) with Host (CrossOriginProtection).
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://$admin_upstream;
    }

    location /api/ {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://api;
    }

    location / {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://web;
    }
  }

  # /admin goes to the web app, /api/v1/admin to the API.
  map $uri $admin_upstream {
    default web;
    ~^/api/v1/admin api;
  }
}
