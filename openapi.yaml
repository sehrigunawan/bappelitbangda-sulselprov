openapi: 3.0.3
info:
  title: Bappelitbangda Sulsel web API
  version: 0.1.0
  description: >
    API contract. This file is the single source of truth: Go server code and the TypeScript
    client are generated from it (`make gen`). Modules and their specs: `docs/modules/`.
servers:
  - url: /
tags:
  - name: system
    description: Service health and other operational endpoints.
  - name: auth
    description: >
      Admin sign-in, sessions, TOTP, step-up and user management (FR-33, NFR-05, NFR-17).
      Spec: `docs/modules/auth.md`.
paths:
  /api/v1/health:
    get:
      operationId: getHealth
      summary: Liveness check
      description: Reports that the process is running. It does not check the database.
      tags: [system]
      responses:
        "200":
          description: The service is running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              example:
                status: ok
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/admin/auth/session:
    post:
      operationId: createSession
      summary: Sign in with username and password
      description: >
        Checks the credentials and starts a new session (any existing session is destroyed
        first). The returned stage says what the user must do next; only `authenticated`
        grants permissions. An unknown username, a wrong password, a disabled user and a
        username that does not match the username pattern all answer the same 401. Login is
        throttled per account and per client IP: a blocked key, or the failure that reaches the
        threshold, answers 429 with `Retry-After`.
      tags: [auth]
      security: []
      requestBody:
        description: Username and password.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
            example:
              username: andi.admin
              password: kuda-laut-biru-77
      responses:
        "200":
          description: >
            Password accepted. The session cookie is set (`__Host-bpl_session`, or `bpl_session`
            in development); its token differs from any token sent with the request.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetSessionCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionState"
              examples:
                authenticated:
                  $ref: "#/components/examples/SessionAuthenticated"
                totpRequired:
                  $ref: "#/components/examples/SessionTotpRequired"
                passwordChangeRequired:
                  $ref: "#/components/examples/SessionPasswordChangeRequired"
                totpEnrollmentRequired:
                  $ref: "#/components/examples/SessionTotpEnrollmentRequired"
        "400":
          description: The request body is not valid JSON or not an object.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                title: Bad Request
                status: 400
        "401":
          description: >
            Wrong credentials. The body is identical for an unknown username, a wrong password,
            a disabled user and a malformed username.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                title: Unauthorized
                status: 401
                detail: Nama pengguna atau kata sandi salah.
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/Problem"
    get:
      operationId: getSession
      summary: Current session
      description: >
        Returns the session state for any session, including pending stages. The admin shell
        uses it as its route guard.
      tags: [auth]
      security:
        - cookieAuth: []
      responses:
        "200":
          description: The current session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionState"
              examples:
                authenticated:
                  $ref: "#/components/examples/SessionAuthenticated"
                totpRequired:
                  $ref: "#/components/examples/SessionTotpRequired"
                passwordChangeRequired:
                  $ref: "#/components/examples/SessionPasswordChangeRequired"
                totpEnrollmentRequired:
                  $ref: "#/components/examples/SessionTotpEnrollmentRequired"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteSession
      summary: Sign out
      description: Destroys the current session, at any stage. The old cookie no longer works.
      tags: [auth]
      security:
        - cookieAuth: []
      responses:
        "204":
          description: Signed out.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/admin/auth/session/totp:
    post:
      operationId: createTotpVerification
      summary: Complete sign-in with a TOTP or recovery code
      description: >
        Allowed only at stage `totp_required`. Send exactly one of `code` (6 digits) or
        `recoveryCode`. A TOTP code is accepted only if its time step is newer than the last
        one used; a recovery code works once. A wrong or replayed code answers 401 and counts
        toward the login throttle. On success the session token is renewed and the stage
        resolves again.
      tags: [auth]
      security:
        - cookieAuth: []
      requestBody:
        description: Exactly one of a TOTP code or a recovery code.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TotpVerification"
            example:
              code: "492039"
      responses:
        "200":
          description: Code accepted. The session token is renewed.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetSessionCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionState"
              examples:
                authenticated:
                  $ref: "#/components/examples/SessionAuthenticated"
                passwordChangeRequired:
                  $ref: "#/components/examples/SessionPasswordChangeRequired"
        "400":
          description: Neither or both of `code` and `recoveryCode` are present, or the body is malformed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                title: Bad Request
                status: 400
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/admin/auth/session/step-up:
    post:
      operationId: createStepUp
      summary: Re-verify with a TOTP code
      description: >
        Stage `authenticated` only. Takes a fresh TOTP code (recovery codes are not accepted)
        and opens a 10-minute step-up window for sensitive operations. A code already used at
        login in the same 30-second step is rejected. A wrong code answers 401 and counts
        toward the throttle. A user without confirmed TOTP gets 403.
      tags: [auth]
      security:
        - cookieAuth: []
      requestBody:
        description: A fresh TOTP code.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TotpCode"
            example:
              code: "492039"
      responses:
        "200":
          description: Step-up granted until `expiresAt`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StepUp"
              example:
                expiresAt: "2026-10-15T06:15:00Z"
        "400":
          description: The body is malformed or `code` is not 6 digits.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                title: Bad Request
                status: 400
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/admin/auth/password:
    put:
      operationId: updatePassword
      summary: Change own password
      description: >
        Stage `authenticated` or `password_change_required`. Checks the current password (a
        wrong one answers 400 and counts toward the throttle) and the password policy. On
        success every other session of the user ends, this session keeps going with a renewed
        token, the step-up window is cleared and the stage resolves again.
      tags: [auth]
      security:
        - cookieAuth: []
      requestBody:
        description: Current and new password.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordChange"
            example:
              currentPassword: k7m2x9qrt3hv8nc4
              newPassword: kuda-laut-biru-77
      responses:
        "204":
          description: Password changed.
        "400":
          description: >
            The new password fails the policy, or the current password is wrong. `detail` is
            one of the texts in the examples and is shown to the user as is.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                tooShort:
                  summary: Fewer than 12 characters
                  value:
                    title: Bad Request
                    status: 400
                    detail: Minimal 12 karakter.
                tooLong:
                  summary: More than 128 characters
                  value:
                    title: Bad Request
                    status: 400
                    detail: Maksimal 128 karakter.
                tooCommon:
                  summary: In the common-password list
                  value:
                    title: Bad Request
                    status: 400
                    detail: Kata sandi terlalu umum.
                containsUsername:
                  summary: Equal to or contains the username
                  value:
                    title: Bad Request
                    status: 400
                    detail: Kata sandi tidak boleh memuat nama pengguna.
                wrongCurrentPassword:
                  summary: Wrong current password
                  value:
                    title: Bad Request
                    status: 400
                    detail: Kata sandi saat ini salah.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/admin/auth/totp:
    post:
      operationId: createTotpEnrollment
      summary: Start TOTP enrollment
      description: >
        Stage `authenticated` or `totp_enrollment_required`. Creates a new pending TOTP secret
        (replacing an earlier unconfirmed one) and returns it with a QR code. 409 once TOTP is
        confirmed; an admin resets it instead.
      tags: [auth]
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Pending enrollment created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TotpEnrollment"
              example:
                secret: JBSWY3DPEHPK3PXPJBSWY3DPEHPK3PXP
                otpauthUri: otpauth://totp/Bappelitbangda%20Sulsel:andi.admin?algorithm=SHA1&digits=6&issuer=Bappelitbangda%20Sulsel&period=30&secret=JBSWY3DPEHPK3PXPJBSWY3DPEHPK3PXP
                qrCodePng: iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: TOTP is already confirmed for this user.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                title: Conflict
                status: 409
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: updateTotpEnrollment
      summary: Confirm TOTP enrollment
      description: >
        Stage `authenticated` or `totp_enrollment_required`. Confirms the pending secret with a
        code from the authenticator app and returns 10 recovery codes, shown once. A code whose
        time step is not newer than the last one used is rejected. From stage
        `totp_enrollment_required` the stage resolves again and the session token is renewed.
      tags: [auth]
      security:
        - cookieAuth: []
      requestBody:
        description: A code from the authenticator app for the pending secret.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TotpCode"
            example:
              code: "492039"
      responses:
        "200":
          description: TOTP confirmed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryCodes"
              example:
                codes: [7k2mp-x9qrt, 3hv8n-c4wze, q0d5j-m6tya, b8r2f-n7kxs, z4c6w-p1hmd, e9t3g-v5jqa, m2x7s-k8bnf, r6d1z-w3pce, h5q9v-t0gjm, n1f4k-y2rsx]
        "400":
          description: Wrong code, or a malformed body.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                title: Bad Request
                status: 400
                detail: Kode tidak valid.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: There is no pending enrollment to confirm.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                title: Conflict
                status: 409
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/admin/auth/totp/recovery-codes:
    post:
      operationId: createRecoveryCodes
      summary: Regenerate recovery codes
      description: >
        Stage `authenticated` with an open step-up window. Replaces all recovery codes with 10
        new ones, shown once; the old codes stop working.
      tags: [auth]
      security:
        - cookieAuth: []
      responses:
        "200":
          description: New recovery codes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryCodes"
              example:
                codes: [7k2mp-x9qrt, 3hv8n-c4wze, q0d5j-m6tya, b8r2f-n7kxs, z4c6w-p1hmd, e9t3g-v5jqa, m2x7s-k8bnf, r6d1z-w3pce, h5q9v-t0gjm, n1f4k-y2rsx]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/admin/auth/users:
    get:
      operationId: listUsers
      summary: List admin users
      description: >
        Permission `users.manage`. Users ordered by username ascending, numbered pages.
        A malformed or out-of-range `page` or `pageSize` answers 400.
      tags: [auth]
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: One page of users.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPage"
              example:
                items:
                  - id: 12
                    username: sari.ppid
                    fullName: Sari Wulandari
                    roles: [ppid_officer]
                    active: true
                    totpEnrolled: true
                    lastLoginAt: "2026-10-15T06:05:00Z"
                    createdAt: "2026-10-01T01:00:00Z"
                page: 1
                pageSize: 10
                total: 1
        "400":
          description: Malformed or out-of-range `page` or `pageSize`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                title: Bad Request
                status: 400
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createUser
      summary: Create an admin user
      description: >
        Permission `users.manage`. Creates the user with a temporary password, returned once;
        the user must change it at first sign-in.
      tags: [auth]
      security:
        - cookieAuth: []
      requestBody:
        description: The new user.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreate"
            example:
              username: sari.ppid
              fullName: Sari Wulandari
              roles: [ppid_officer]
      responses:
        "201":
          description: User created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserCreated"
              example:
                user:
                  id: 12
                  username: sari.ppid
                  fullName: Sari Wulandari
                  roles: [ppid_officer]
                  active: true
                  totpEnrolled: false
                  lastLoginAt: null
                  createdAt: "2026-10-01T01:00:00Z"
                temporaryPassword: k7m2x9qrt3hv8nc4
        "400":
          description: Invalid username, full name or roles (unknown, empty or repeated).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                title: Bad Request
                status: 400
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: The username is taken.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                title: Conflict
                status: 409
                detail: Nama pengguna sudah dipakai.
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/admin/auth/users/{userId}:
    parameters:
      - $ref: "#/components/parameters/UserId"
    get:
      operationId: getUser
      summary: Get an admin user
      description: Permission `users.manage`. A malformed `userId`, or one below 1, answers 400.
      tags: [auth]
      security:
        - cookieAuth: []
      responses:
        "200":
          description: The user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
              example:
                id: 12
                username: sari.ppid
                fullName: Sari Wulandari
                roles: [ppid_officer]
                active: true
                totpEnrolled: true
                lastLoginAt: "2026-10-15T06:05:00Z"
                createdAt: "2026-10-01T01:00:00Z"
        "400":
          $ref: "#/components/responses/InvalidUserId"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/UserNotFound"
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: updateUser
      summary: Update an admin user
      description: >
        Permission `users.manage`. Replaces the full name, roles and active flag; the username
        never changes. Role changes apply on the user's next request. Disabling a user ends
        their sessions. 409 when the caller would remove their own `super_admin` role, disable
        themselves, or leave no active Super Admin.
      tags: [auth]
      security:
        - cookieAuth: []
      requestBody:
        description: The new full name, roles and active flag.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
            example:
              fullName: Sari Wulandari
              roles: [ppid_officer, document_operator]
              active: true
      responses:
        "200":
          description: The updated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
              example:
                id: 12
                username: sari.ppid
                fullName: Sari Wulandari
                roles: [ppid_officer, document_operator]
                active: true
                totpEnrolled: true
                lastLoginAt: "2026-10-15T06:05:00Z"
                createdAt: "2026-10-01T01:00:00Z"
        "400":
          description: Malformed `userId`, or invalid full name or roles.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                title: Bad Request
                status: 400
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/UserNotFound"
        "409":
          description: Self-demotion, self-disable, or no active Super Admin would remain.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                title: Conflict
                status: 409
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/admin/auth/users/{userId}/password-reset:
    parameters:
      - $ref: "#/components/parameters/UserId"
    post:
      operationId: createPasswordReset
      summary: Reset a user's password
      description: >
        Permission `users.manage` with an open step-up window. Sets a new temporary password,
        returned once, and ends the user's sessions. 409 on the caller's own id (use
        `updatePassword`).
      tags: [auth]
      security:
        - cookieAuth: []
      responses:
        "200":
          description: The new temporary password.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemporaryPassword"
              example:
                temporaryPassword: k7m2x9qrt3hv8nc4
        "400":
          $ref: "#/components/responses/InvalidUserId"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/UserNotFound"
        "409":
          $ref: "#/components/responses/OwnAccount"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/admin/auth/users/{userId}/totp:
    parameters:
      - $ref: "#/components/parameters/UserId"
    delete:
      operationId: deleteUserTotp
      summary: Reset a user's TOTP
      description: >
        Permission `users.manage` with an open step-up window. Clears the user's TOTP secret
        and recovery codes and ends their sessions; a user whose role requires TOTP enrolls
        again at next sign-in. 409 on the caller's own id (use the CLI break-glass command).
      tags: [auth]
      security:
        - cookieAuth: []
      responses:
        "204":
          description: TOTP cleared.
        "400":
          $ref: "#/components/responses/InvalidUserId"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/UserNotFound"
        "409":
          $ref: "#/components/responses/OwnAccount"
        default:
          $ref: "#/components/responses/Problem"
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: __Host-bpl_session
      description: >
        Session cookie set by `createSession`. HttpOnly, SameSite=Strict, Path=/. In
        development over http (`AUTH_COOKIE_SECURE=false`) it is named `bpl_session` and is not
        Secure.
  parameters:
    Page:
      name: page
      in: query
      required: false
      description: Page number, starting at 1.
      schema:
        type: integer
        minimum: 1
        default: 1
        example: 1
      example: 1
    PageSize:
      name: pageSize
      in: query
      required: false
      description: Items per page, 1 to 50.
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 10
        example: 10
      example: 10
    UserId:
      name: userId
      in: path
      required: true
      description: User id.
      schema:
        type: integer
        format: int64
        minimum: 1
        example: 12
      example: 12
  headers:
    RetryAfter:
      description: Whole seconds until the throttle block ends, rounded up.
      schema:
        type: integer
        minimum: 1
        example: 900
      example: 900
    SetSessionCookie:
      description: >
        The session cookie, for example
        `__Host-bpl_session=<token>; Path=/; HttpOnly; Secure; SameSite=Strict`.
      schema:
        type: string
        example: __Host-bpl_session=R2x6d0p1c2t0b2tlbg; Path=/; HttpOnly; Secure; SameSite=Strict
      example: __Host-bpl_session=R2x6d0p1c2t0b2tlbg; Path=/; HttpOnly; Secure; SameSite=Strict
  examples:
    SessionAuthenticated:
      summary: Signed in (Super Admin with TOTP and an open step-up window)
      description: Stage `authenticated`; permissions are the Super Admin's effective set.
      value:
        stage: authenticated
        user:
          id: 1
          username: andi.admin
          fullName: Andi Pratama
          roles: [super_admin]
        permissions:
          - { area: publications, level: manage }
          - { area: pages, level: manage }
          - { area: documents, level: manage }
          - { area: site_content, level: manage }
          - { area: media, level: manage }
          - { area: ppid, level: manage }
          - { area: users, level: manage }
          - { area: activity_log, level: view }
          - { area: statistics, level: view }
        totpEnrolled: true
        stepUpExpiresAt: "2026-10-15T06:15:00Z"
    SessionTotpRequired:
      summary: Password accepted, TOTP code required
      description: Stage `totp_required`; no permissions until the code is verified.
      value:
        stage: totp_required
        user:
          id: 1
          username: andi.admin
          fullName: Andi Pratama
          roles: [super_admin]
        permissions: []
        totpEnrolled: true
        stepUpExpiresAt: null
    SessionPasswordChangeRequired:
      summary: Temporary password, must be changed
      description: Stage `password_change_required` after a temporary password.
      value:
        stage: password_change_required
        user:
          id: 12
          username: sari.ppid
          fullName: Sari Wulandari
          roles: [ppid_officer]
        permissions: []
        totpEnrolled: false
        stepUpExpiresAt: null
    SessionTotpEnrollmentRequired:
      summary: Role requires TOTP, not enrolled yet
      description: Stage `totp_enrollment_required` for a Petugas PPID without TOTP.
      value:
        stage: totp_enrollment_required
        user:
          id: 12
          username: sari.ppid
          fullName: Sari Wulandari
          roles: [ppid_officer]
        permissions: []
        totpEnrolled: false
        stepUpExpiresAt: null
  responses:
    Problem:
      description: Error (RFC 9457 problem details)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            title: Not Found
            status: 404
            detail: Publikasi tidak ditemukan.
    Unauthorized:
      description: No valid session, the session expired or ended, or the session is still at a pending stage where this operation needs `authenticated`. Also a wrong or replayed code.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            title: Unauthorized
            status: 401
            detail: Sesi tidak valid atau telah berakhir.
    Forbidden:
      description: >
        Access denied: missing permission, a session stage this operation does not allow, a
        step-up window that is missing or expired, or a cross-origin request. `detail` tells
        them apart.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            forbidden:
              summary: Missing permission or wrong stage
              value:
                title: Forbidden
                status: 403
                detail: Akses ditolak.
            stepUpRequired:
              summary: Step-up needed
              value:
                title: Forbidden
                status: 403
                detail: Verifikasi ulang dengan kode autentikator diperlukan.
            crossOrigin:
              summary: Cross-origin request
              value:
                title: Forbidden
                status: 403
                detail: Permintaan lintas situs ditolak.
    TooManyRequests:
      description: Too many failed attempts for this account or client IP. Retry after `Retry-After` seconds.
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            title: Too Many Requests
            status: 429
    InvalidUserId:
      description: "`userId` is not an integer or is below 1."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            title: Bad Request
            status: 400
    UserNotFound:
      description: No user with this id.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            title: Not Found
            status: 404
    OwnAccount:
      description: The target is the caller's own account.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            title: Conflict
            status: 409
  schemas:
    Health:
      type: object
      description: Liveness report.
      required: [status]
      properties:
        status:
          type: string
          description: Always `ok` while the process runs.
          enum: [ok]
          example: ok
      example:
        status: ok
    Problem:
      type: object
      description: Error body (RFC 9457 problem details). Every operation returns it for every non-success status.
      required: [title, status]
      properties:
        title:
          type: string
          description: Short, human-readable summary of the problem type.
          example: Not Found
        status:
          type: integer
          description: The HTTP status code.
          example: 404
        detail:
          type: string
          description: Explanation specific to this occurrence. Omitted for server errors.
          example: Publikasi tidak ditemukan.
      example:
        title: Not Found
        status: 404
        detail: Publikasi tidak ditemukan.
    Role:
      type: string
      description: >
        Admin role. Labels: super_admin "Super Admin", humas_editor "Editor Humas",
        document_operator "Operator Dokumen", ppid_officer "Petugas PPID", leadership "Pimpinan".
      enum: [super_admin, humas_editor, document_operator, ppid_officer, leadership]
      example: humas_editor
    PermissionArea:
      type: string
      description: Permission area, one per row of the PRD section 3.4 matrix.
      enum: [publications, pages, documents, site_content, media, ppid, users, activity_log, statistics]
      example: publications
    PermissionLevel:
      type: string
      description: Access level; `manage` implies `view`.
      enum: [view, manage]
      example: manage
    SessionStage:
      type: string
      description: >
        What the session may do. Only `authenticated` grants permissions; the other stages
        allow only the step they name.
      enum: [password_change_required, totp_required, totp_enrollment_required, authenticated]
      example: authenticated
    Permission:
      type: object
      description: An effective permission of the signed-in user.
      required: [area, level]
      properties:
        area:
          $ref: "#/components/schemas/PermissionArea"
        level:
          $ref: "#/components/schemas/PermissionLevel"
      example:
        area: publications
        level: manage
    Credentials:
      type: object
      description: Sign-in form. A username that does not match the username pattern is answered like a wrong password.
      required: [username, password]
      properties:
        username:
          type: string
          maxLength: 64
          description: Username as typed.
          example: andi.admin
        password:
          type: string
          maxLength: 128
          description: Password.
          example: kuda-laut-biru-77
      example:
        username: andi.admin
        password: kuda-laut-biru-77
    SessionUser:
      type: object
      description: The user behind the session.
      required: [id, username, fullName, roles]
      properties:
        id:
          type: integer
          format: int64
          description: User id.
          example: 1
        username:
          type: string
          description: Username.
          example: andi.admin
        fullName:
          type: string
          description: Full name.
          example: Andi Pratama
        roles:
          type: array
          description: Assigned roles.
          items:
            $ref: "#/components/schemas/Role"
          example: [super_admin]
      example:
        id: 1
        username: andi.admin
        fullName: Andi Pratama
        roles: [super_admin]
    SessionState:
      type: object
      description: The current session.
      required: [stage, user, permissions, totpEnrolled, stepUpExpiresAt]
      properties:
        stage:
          $ref: "#/components/schemas/SessionStage"
        user:
          $ref: "#/components/schemas/SessionUser"
        permissions:
          type: array
          description: >
            Effective permissions, one per area at its highest level, in matrix order. Empty
            unless `stage` is `authenticated`.
          items:
            $ref: "#/components/schemas/Permission"
          example:
            - { area: publications, level: manage }
        totpEnrolled:
          type: boolean
          description: True once the user's TOTP is confirmed.
          example: true
        stepUpExpiresAt:
          type: string
          format: date-time
          nullable: true
          description: End of the step-up window; null when there is none or it has passed.
          example: "2026-10-15T06:15:00Z"
      example:
        stage: authenticated
        user:
          id: 1
          username: andi.admin
          fullName: Andi Pratama
          roles: [humas_editor]
        permissions:
          - { area: publications, level: manage }
          - { area: pages, level: manage }
          - { area: site_content, level: manage }
          - { area: media, level: manage }
        totpEnrolled: false
        stepUpExpiresAt: null
    TotpVerification:
      type: object
      description: Second sign-in factor. Exactly one of `code` and `recoveryCode` must be present.
      properties:
        code:
          type: string
          pattern: "^[0-9]{6}$"
          description: 6-digit code from the authenticator app.
          example: "492039"
        recoveryCode:
          type: string
          maxLength: 32
          description: >
            Recovery code. Dashes and spaces are ignored, case does not matter, `o` reads as
            `0` and `i`/`l` as `1`.
          example: 7k2mp-x9qrt
      example:
        code: "492039"
    TotpCode:
      type: object
      description: A 6-digit TOTP code.
      required: [code]
      properties:
        code:
          type: string
          pattern: "^[0-9]{6}$"
          description: 6-digit code from the authenticator app.
          example: "492039"
      example:
        code: "492039"
    TotpEnrollment:
      type: object
      description: A pending TOTP secret (SHA-1, 6 digits, 30 s, issuer `Bappelitbangda Sulsel`).
      required: [secret, otpauthUri, qrCodePng]
      properties:
        secret:
          type: string
          description: Base32 secret for manual entry.
          example: JBSWY3DPEHPK3PXPJBSWY3DPEHPK3PXP
        otpauthUri:
          type: string
          description: "`otpauth://` URI encoded in the QR code."
          example: otpauth://totp/Bappelitbangda%20Sulsel:andi.admin?algorithm=SHA1&digits=6&issuer=Bappelitbangda%20Sulsel&period=30&secret=JBSWY3DPEHPK3PXPJBSWY3DPEHPK3PXP
        qrCodePng:
          type: string
          format: byte
          description: QR code as a base64 PNG, for a `data:image/png;base64,` image.
          example: iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=
      example:
        secret: JBSWY3DPEHPK3PXPJBSWY3DPEHPK3PXP
        otpauthUri: otpauth://totp/Bappelitbangda%20Sulsel:andi.admin?algorithm=SHA1&digits=6&issuer=Bappelitbangda%20Sulsel&period=30&secret=JBSWY3DPEHPK3PXPJBSWY3DPEHPK3PXP
        qrCodePng: iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=
    RecoveryCodes:
      type: object
      description: Ten single-use recovery codes, shown once.
      required: [codes]
      properties:
        codes:
          type: array
          minItems: 10
          maxItems: 10
          description: Codes in `xxxxx-xxxxx` form from the alphabet `0123456789abcdefghjkmnpqrstvwxyz`.
          items:
            type: string
            pattern: "^[0-9a-hjkmnp-tv-z]{5}-[0-9a-hjkmnp-tv-z]{5}$"
            description: One recovery code.
            example: 7k2mp-x9qrt
          example: [7k2mp-x9qrt, 3hv8n-c4wze, q0d5j-m6tya, b8r2f-n7kxs, z4c6w-p1hmd, e9t3g-v5jqa, m2x7s-k8bnf, r6d1z-w3pce, h5q9v-t0gjm, n1f4k-y2rsx]
      example:
        codes: [7k2mp-x9qrt, 3hv8n-c4wze, q0d5j-m6tya, b8r2f-n7kxs, z4c6w-p1hmd, e9t3g-v5jqa, m2x7s-k8bnf, r6d1z-w3pce, h5q9v-t0gjm, n1f4k-y2rsx]
    PasswordChange:
      type: object
      description: Own password change.
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          maxLength: 128
          description: The current (or temporary) password.
          example: k7m2x9qrt3hv8nc4
        newPassword:
          type: string
          minLength: 12
          maxLength: 128
          description: >
            New password: 12 to 128 Unicode code points, not a common password, not equal to
            or containing the username.
          example: kuda-laut-biru-77
      example:
        currentPassword: k7m2x9qrt3hv8nc4
        newPassword: kuda-laut-biru-77
    StepUp:
      type: object
      description: An open step-up window.
      required: [expiresAt]
      properties:
        expiresAt:
          type: string
          format: date-time
          description: End of the step-up window.
          example: "2026-10-15T06:15:00Z"
      example:
        expiresAt: "2026-10-15T06:15:00Z"
    User:
      type: object
      description: An admin user.
      required: [id, username, fullName, roles, active, totpEnrolled, lastLoginAt, createdAt]
      properties:
        id:
          type: integer
          format: int64
          description: User id.
          example: 12
        username:
          type: string
          description: Username; never changes.
          example: sari.ppid
        fullName:
          type: string
          description: Full name.
          example: Sari Wulandari
        roles:
          type: array
          description: Assigned roles.
          items:
            $ref: "#/components/schemas/Role"
          example: [ppid_officer]
        active:
          type: boolean
          description: False once the user is disabled.
          example: true
        totpEnrolled:
          type: boolean
          description: True once the user's TOTP is confirmed.
          example: true
        lastLoginAt:
          type: string
          format: date-time
          nullable: true
          description: Last full sign-in; null if never.
          example: "2026-10-15T06:05:00Z"
        createdAt:
          type: string
          format: date-time
          description: Creation time.
          example: "2026-10-01T01:00:00Z"
      example:
        id: 12
        username: sari.ppid
        fullName: Sari Wulandari
        roles: [ppid_officer]
        active: true
        totpEnrolled: true
        lastLoginAt: "2026-10-15T06:05:00Z"
        createdAt: "2026-10-01T01:00:00Z"
    UserPage:
      type: object
      description: One page of users, ordered by username.
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          description: Users on this page.
          items:
            $ref: "#/components/schemas/User"
        page:
          type: integer
          description: Page number.
          example: 1
        pageSize:
          type: integer
          description: Page size.
          example: 10
        total:
          type: integer
          description: Number of users across all pages.
          example: 1
      example:
        items:
          - id: 12
            username: sari.ppid
            fullName: Sari Wulandari
            roles: [ppid_officer]
            active: true
            totpEnrolled: true
            lastLoginAt: "2026-10-15T06:05:00Z"
            createdAt: "2026-10-01T01:00:00Z"
        page: 1
        pageSize: 10
        total: 1
    UserCreate:
      type: object
      description: New admin user.
      required: [username, fullName, roles]
      properties:
        username:
          type: string
          pattern: "^[a-z0-9._-]{3,32}$"
          description: Username, 3 to 32 of `a-z`, `0-9`, `.`, `_`, `-`.
          example: sari.ppid
        fullName:
          type: string
          minLength: 1
          maxLength: 100
          description: Full name.
          example: Sari Wulandari
        roles:
          type: array
          minItems: 1
          uniqueItems: true
          description: Roles, at least one.
          items:
            $ref: "#/components/schemas/Role"
          example: [ppid_officer]
      example:
        username: sari.ppid
        fullName: Sari Wulandari
        roles: [ppid_officer]
    UserUpdate:
      type: object
      description: Editable fields of an admin user.
      required: [fullName, roles, active]
      properties:
        fullName:
          type: string
          minLength: 1
          maxLength: 100
          description: Full name.
          example: Sari Wulandari
        roles:
          type: array
          minItems: 1
          uniqueItems: true
          description: Roles, at least one.
          items:
            $ref: "#/components/schemas/Role"
          example: [ppid_officer, document_operator]
        active:
          type: boolean
          description: False disables the user and ends their sessions.
          example: true
      example:
        fullName: Sari Wulandari
        roles: [ppid_officer, document_operator]
        active: true
    UserCreated:
      type: object
      description: A created user and its temporary password, shown once.
      required: [user, temporaryPassword]
      properties:
        user:
          $ref: "#/components/schemas/User"
        temporaryPassword:
          type: string
          pattern: "^[0-9a-hjkmnp-tv-z]{16}$"
          description: 16-character temporary password; must be changed at first sign-in.
          example: k7m2x9qrt3hv8nc4
      example:
        user:
          id: 12
          username: sari.ppid
          fullName: Sari Wulandari
          roles: [ppid_officer]
          active: true
          totpEnrolled: false
          lastLoginAt: null
          createdAt: "2026-10-01T01:00:00Z"
        temporaryPassword: k7m2x9qrt3hv8nc4
    TemporaryPassword:
      type: object
      description: A new temporary password, shown once.
      required: [temporaryPassword]
      properties:
        temporaryPassword:
          type: string
          pattern: "^[0-9a-hjkmnp-tv-z]{16}$"
          description: 16-character temporary password; must be changed at next sign-in.
          example: k7m2x9qrt3hv8nc4
      example:
        temporaryPassword: k7m2x9qrt3hv8nc4
