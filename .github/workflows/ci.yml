name: ci
on:
  pull_request:
  push:
    branches: [main, development]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify-full:
    name: verify-full (${{ matrix.pg }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        pg: ["16", "18"]
    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # psql and the Makefile (PG_SUPER_URL default) read these. CI=true is set by GitHub.
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: api/go.mod
          cache-dependency-path: |
            api/go.sum
            tools/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Applied migrations must not change
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: scripts/check-migrations-immutable.sh "origin/${BASE_REF}"
      - name: Web dependencies
        run: npm ci
        working-directory: web
      - name: Playwright browser for component tests
        run: npx --no-install playwright install --with-deps chromium
        working-directory: web
      - name: Verify
        run: make verify-full
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-pg${{ matrix.pg }}
          path: "**/*.log"
          if-no-files-found: ignore
          retention-days: 7
  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: api/go.mod
          cache-dependency-path: |
            api/go.sum
            tools/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Build
        run: make build
      - name: Container images build
        run: make docker-build
  workflow-audit:
    name: workflow-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Audit workflows with zizmor
        run: |
          python3 -m venv "$RUNNER_TEMP/zizmor"
          "$RUNNER_TEMP/zizmor/bin/pip" install --quiet zizmor==1.31.1
          "$RUNNER_TEMP/zizmor/bin/zizmor" --offline --min-severity medium .github/workflows
  promotion-source:
    name: promotion-source
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: PRs into main must come from this repository's development branch
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$BASE_REF" = "main" ] && { [ "$HEAD_REF" != "development" ] || [ "$HEAD_REPO" != "$REPO" ]; }; then
            echo "ERROR: only development may be merged into main (docs/workflow/team-and-agents.md, Promotion)."; exit 1
          fi
          echo "promotion-source: OK"
  contract-diff:
    name: contract-diff
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: api/go.mod
          cache-dependency-path: |
            api/go.sum
            tools/go.sum
      - name: Breaking changes against the base branch (report only, never fails)
        env:
          BASE_REF: ${{ github.base_ref }}
        run: make contract-diff BASE="origin/${BASE_REF}" >> "$GITHUB_STEP_SUMMARY"
