version: 2
# 7-day cooldown on version updates: a compromised release is usually caught within days.
# Security updates ignore the cooldown.
updates:
  - package-ecosystem: gomod
    directory: /api
    target-branch: development
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    groups:
      go-minor-patch: { update-types: [minor, patch] }
  - package-ecosystem: gomod
    directory: /tools
    target-branch: development
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    groups:
      go-tools-minor-patch: { update-types: [minor, patch] }
  - package-ecosystem: npm
    directory: /web
    target-branch: development
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    groups:
      npm-minor-patch: { update-types: [minor, patch] }
  - package-ecosystem: github-actions
    directory: /
    target-branch: development
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
  - package-ecosystem: docker
    directory: /
    target-branch: development
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
  - package-ecosystem: docker
    directory: /api
    target-branch: development
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
  - package-ecosystem: docker
    directory: /web
    target-branch: development
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: /deploy
    target-branch: development
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
